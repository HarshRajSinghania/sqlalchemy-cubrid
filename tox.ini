[tox]
envlist = lint, typecheck-sa20, typecheck-sa21, py310, py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
usedevelop = true
extras =
    pycubrid
    alembic
setenv = COVERAGE_FILE={envtmpdir}/.coverage
deps =
    pytest>=7.0
    pytest-cov
    pytest-asyncio
    hypothesis>=6.0
commands =
    pytest test/ -v \
        -m "not integration" \
        --cov=sqlalchemy_cubrid \
        --cov-report=term-missing \
        --cov-fail-under=95

[testenv:lint]
skip_install = true
deps = ruff==0.16.8
commands =
    python scripts/check_tool_versions.py
    ruff check sqlalchemy_cubrid/ test/
    ruff format --check sqlalchemy_cubrid/ test/

[testenv:typecheck-sa20]
basepython = python3.10
extras = alembic
deps =
    mypy==2.3.1
    SQLAlchemy[asyncio]==2.0.53
setenv = MYPY_CACHE_DIR={envtmpdir}/mypy
allowlist_externals = make
commands = make typecheck PYTHON={envpython}

[testenv:typecheck-sa21]
basepython = python3.13
extras = alembic
deps =
    mypy==2.3.1
    SQLAlchemy[asyncio]==2.1.1
setenv = MYPY_CACHE_DIR={envtmpdir}/mypy
allowlist_externals = make
commands = make typecheck PYTHON={envpython}

[testenv:integration]
usedevelop = true
passenv = CUBRID_TEST_URL
commands =
    pytest test/ -m integration -v
